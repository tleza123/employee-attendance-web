  <script>
    
/**
 * DE TEAM — Client Application Logic & State Controller
 * Apps Script HTML Service Vanilla JavaScript
 */

(function () {
  'use strict';

  // --- 1. RPC Client Bridge ---
  const TeamRpc = (() => {
    const allowed = new Set([
      'getBootstrap', 'getDay', 'saveAttendance', 'getMonthReport',
      'getEmployeeMonth', 'saveEmployee', 'setEmploymentEnd', 'addRate',
      'saveExtraTemplate', 'prepareMonthExtras', 'saveMonthExtra',
      'confirmMonthExtras', 'getPhotos', 'savePhoto', 'saveCalendar',
      'closeMonth', 'reopenMonth'
    ]);

    function call(method, payload, timeoutMs = 25000) {
      if (!allowed.has(method)) return Promise.reject(new Error('INVALID_METHOD'));
      return new Promise((resolve, reject) => {
        let settled = false;
        const timer = setTimeout(() => {
          settled = true;
          reject(new Error('UNKNOWN'));
        }, timeoutMs);

        const finish = (fn, value) => {
          clearTimeout(timer);
          if (!settled) {
            settled = true;
            fn(value);
          }
        };

        if (typeof google === 'undefined' || !google.script || !google.script.run) {
          // Dev mock fallback if running directly in a standalone browser
          settled = true;
          clearTimeout(timer);
          reject(new Error('NO_GOOGLE_SCRIPT_RUN'));
          return;
        }

        google.script.run
          .withSuccessHandler(val => finish(resolve, val))
          .withFailureHandler(err => finish(reject, err))[method](payload);
      });
    }

    return { call };
  })();

  // --- 2. State & Helpers ---
  const appRoot = document.getElementById('team-app');
  const contentEl = document.getElementById('team-content');
  const liveEl = document.getElementById('team-live');
  const brandTitleEl = document.getElementById('team-brand-title');
  const headerInfoEl = document.getElementById('team-header-info');

  const state = {
    tab: 'attendance',
    serverToday: '',
    selectedDate: '',
    selectedMonth: '',
    filterAttendance: false, // false = all, true = unmarked only
    searchQuery: '',
    shopName: 'DE TEAM',

  function announce(msg) {

  function formatMoney(satang) {
    if (typeof satang !== 'number' || !Number.isFinite(satang)) return '0.00';
    return (satang / 100).toLocaleString('th-TH', {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });
  }

  function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function thaiDate(dateStr, options = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }) {
    if (!dateStr) return '';
    const d = new Date(dateStr + 'T12:00:00+07:00');
    return new Intl.DateTimeFormat('th-TH', options).format(d);
  }

  function thaiMonthYear(monthStr) {
    if (!monthStr) return '';
    const d = new Date(monthStr + '-01T12:00:00+07:00');
    return new Intl.DateTimeFormat('th-TH', { month: 'long', year: 'numeric' }).format(d);
  }

  function uuid() {
    if (typeof crypto !== 'undefined' && crypto.randomUUID) {
      return crypto.randomUUID();
    }
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
      const r = Math.random() * 16 | 0;
      const v = c === 'x' ? r : (r & 0x3 | 0x8);
      return v.toString(16);
    });
  }

  function parseMoneySatang(valStr) {
    const clean = String(valStr || '').trim();
    if (!/^(0|[1-9]\d{0,6})(\.\d{1,2})?$/.test(clean)) {
      throw new Error('กรุณากรอกจำนวนเงินให้ถูกต้อง (ทศนิยมไม่เกิน 2 ตำแหน่ง)');
    }
    const parts = clean.split('.');
    const satang = Number(parts[0]) * 100 + Number(((parts[1] || '') + '00').slice(0, 2));
    if (!Number.isSafeInteger(satang) || satang > 100000000) {
      throw new Error('จำนวนเงินสูงเกินกำหนด (สูงสุด 1,000,000.00 บาท)');
    }
    return satang;
  }

  // --- 3. Image Compression Engine (Client-side Canvas) ---
  async function compressPhotoFile(file) {
    if (!['image/jpeg', 'image/png', 'image/webp'].includes(file.type)) {
      throw new Error('กรุณาเลือกไฟล์รูปภาพ JPEG, PNG หรือ WebP');
    }
    if (file.size > 5 * 1024 * 1024) {
      throw new Error('ขนาดไฟล์ต้นฉบับต้องไม่เกิน 5 MB');
    }

    const objectUrl = URL.createObjectURL(file);
    try {
      const img = new Image();
      img.src = objectUrl;
      await img.decode();

      if (img.naturalWidth * img.naturalHeight > 20000000) {
        throw new Error('รูปภาพมีจำนวนพิกเซลมากเกินไป (เกิน 20 ล้านพิกเซล)');
      }

      // คำนวณขนาดย่อโดยคงสัดส่วนเดิม ด้านยาวสุดไม่เกิน 192px
      const maxDim = 192;
      const scale = Math.min(1, maxDim / Math.max(img.naturalWidth, img.naturalHeight));
      const targetW = Math.max(1, Math.round(img.naturalWidth * scale));
      const targetH = Math.max(1, Math.round(img.naturalHeight * scale));

      const canvas = document.createElement('canvas');
      canvas.width = targetW;
      canvas.height = targetH;
      const ctx = canvas.getContext('2d');

      // พื้นหลังสีขาวเพื่อรองรับภาพโปร่งใส PNG/WebP ก่อนแปลงเป็น JPEG
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, targetW, targetH);
      ctx.drawImage(img, 0, 0, targetW, targetH);

      // Re-encode เป็น JPEG โดยปรับ quality จนขนาด base64 <= 32768 ตัวอักษร
      let finalBase64 = '';
      const qualities = [0.8, 0.65, 0.5, 0.35];
      for (const q of qualities) {
        const dataUrl = canvas.toDataURL('image/jpeg', q);
        const rawBase64 = dataUrl.split('base64,')[1] || '';
        if (rawBase64.length <= 32768) {
          finalBase64 = rawBase64;
          break;
        }
      }

      if (!finalBase64 || finalBase64.length > 32768) {
        throw new Error('รูปยังมีขนาดใหญ่เกินไป กรุณาเลือกรูปภาพอื่น');
      }

      return {
        jpegBase64: finalBase64,
        dataUrl: 'data:image/jpeg;base64,' + finalBase64,
        width: targetW,
        height: targetH
      };
    } finally {
      URL.revokeObjectURL(objectUrl);
    }
  }

  // --- 4. Lazy Loading Photos ---
  async function loadMissingPhotos(employeeIds) {
    const needed = employeeIds.filter(id => {
      const emp = state.employees.find(e => e.employeeId === id);
      const cached = state.photosCache.get(id);
      return emp && emp.photoVersion > 0 && (!cached || cached.version !== emp.photoVersion);
    }).slice(0, 8); // โหลดทีละไม่เกิน 8 คนตามข้อกำหนด

    if (needed.length === 0) return;

    try {
      const known = {};
      needed.forEach(id => {
        if (state.photosCache.has(id)) known[id] = state.photosCache.get(id).version;
      });

      const res = await TeamRpc.call('getPhotos', { employeeIds: needed, knownVersions: known });
      if (res && res.photos) {
        Object.keys(res.photos).forEach(empId => {
          const item = res.photos[empId];
          state.photosCache.set(empId, {
            jpegBase64: item.jpegBase64,
            dataUrl: 'data:image/jpeg;base64,' + item.jpegBase64,
            version: item.version
          });
        });
        // อัปเดตรูปเฉพาะส่วนที่แสดงอยู่ใน DOM ปัจจุบัน
        needed.forEach(empId => {
          const avatarEl = document.querySelector(`[data-avatar-for="${empId}"]`);
          if (avatarEl && state.photosCache.has(empId)) {
            const photo = state.photosCache.get(empId);
            avatarEl.innerHTML = `<img src="${photo.dataUrl}" alt="รูปพนักงาน">`;
          }
        });
      }
    } catch (e) {
      // โหลดรูปไม่สำเร็จให้ใช้ชื่อย่อต่อไปโดยไม่ทำให้ระบบหยุดทำงาน
    }
  }

  function renderAvatar(emp) {
    const cached = state.photosCache.get(emp.employeeId);
    if (cached && cached.dataUrl) {
      return `<div class="team-avatar" data-avatar-for="${emp.employeeId}"><img src="${cached.dataUrl}" alt="รูป${escapeHtml(emp.name)}"></div>`;
    }
    const initial = (emp.nickname || emp.name || '?').slice(0, 1);
    return `<div class="team-avatar" data-avatar-for="${emp.employeeId}">${escapeHtml(initial)}</div>`;
  }

  function closeModal() {
    const overlays = document.querySelectorAll('.team-sheet-overlay');
    overlays.forEach(el => el.remove());
    state.activeModal = null;
  }

  // --- 11. Core Navigation & Data Fetching ---
  function switchTab(newTab) {
    if (state.editEmployee !== null) {
      if (!confirm('คุณมีข้อมูลที่ยังไม่ได้บันทึก ต้องการออกจากหน้านี้ใช่หรือไม่?')) return;
      state.editEmployee = null;
      state.editFormDraft = null;
    }
    state.tab = newTab;
    state.selectedDetailId = null;

    document.querySelectorAll('.team-nav-btn').forEach(btn => {
      if (btn.dataset.tab === newTab) {
        btn.setAttribute('aria-current', 'page');
      } else {
        btn.removeAttribute('aria-current');
      }
    });

    if (newTab === 'attendance') {
      renderAttendanceView();
    } else if (newTab === 'reports') {
      loadMonthReport(state.selectedMonth);
    } else if (newTab === 'settings') {
      renderSettingsView();
    }
  }

  async function loadDayAttendance(dateStr) {
    state.selectedDate = dateStr;
    renderAttendanceView();
    try {
      const res = await TeamRpc.call('getDay', dateStr);
      if (state.selectedDate === dateStr) {
        state.dayAttendance = res;
        renderAttendanceView();
      }
    } catch (e) {
      announce('โหลดข้อมูลเช็คชื่อไม่สำเร็จ: ' + (ERROR_MESSAGES[e.message] || e.message));
    }
  }

  async function loadMonthReport(monthKey) {
    state.selectedMonth = monthKey;
    renderReportsView();
    try {
      const res = await TeamRpc.call('getMonthReport', monthKey);
      if (state.selectedMonth === monthKey) {
        state.monthReport = res;
        renderReportsView();
      }
    } catch (e) {
      announce('โหลดรายงานไม่สำเร็จ: ' + (ERROR_MESSAGES[e.message] || e.message));
    }
  }

  // --- 12. Mutation Handlers ---
  async function handleMarkAttendance(employeeId, newStatus) {
    const key = state.selectedDate + '|' + employeeId;
    const day = state.dayAttendance;
    if (!day) return;

    const currentRecord = (day.attendance || []).find(r => r.employeeId === employeeId);
    const expectedRevision = currentRecord ? currentRecord.revision : 0;

    let command = state.pendingCommands.get(key)?.command;
    if (!command) {
      command = {
        dateKey: state.selectedDate,
        employeeId: employeeId,
        status: newStatus,
        expectedRevision: expectedRevision,
        requestId: uuid()
      };
    } else {
      command.status = newStatus;
      command.expectedRevision = expectedRevision;
    }

    state.pendingCommands.set(key, { command, status: 'SAVING', timestamp: Date.now() });
    renderAttendanceView();
    announce(`กำลังบันทึก ${STATUS_LABEL[newStatus]}...`);

    try {
      const res = await TeamRpc.call('saveAttendance', command);
      if (res && res.ok && res.attendance) {
        state.pendingCommands.delete(key);
        // อัปเดตข้อมูล attendance ใน local state
        const attList = day.attendance || [];
        const idx = attList.findIndex(r => r.employeeId === employeeId);
        if (idx >= 0) {
          attList[idx] = res.attendance;
        } else {
          attList.push(res.attendance);
        }
        day.attendance = attList;
        renderAttendanceView();
        announce(`บันทึก ${STATUS_LABEL[newStatus]} เรียบร้อยแล้ว`);
      }
    } catch (e) {
      if (e.message === 'UNKNOWN') {
        state.pendingCommands.set(key, { command, status: 'UNKNOWN', timestamp: Date.now() });
        renderAttendanceView();
        announce('ยังยืนยันผลการบันทึกไม่ได้ กรุณากดตรวจสอบอีกครั้ง');
      } else {
        state.pendingCommands.delete(key);
        renderAttendanceView();
        alert('บันทึกไม่สำเร็จ: ' + (ERROR_MESSAGES[e.message] || e.message));
        // ถ้าเกิด conflict ให้โหลดข้อมูลวันล่าสุดใหม่
        if (e.message === 'CONFLICT') loadDayAttendance(state.selectedDate);
      }
    }
  }

  async function handleClearAttendance(employeeId) {
    closeModal();
    await handleMarkAttendance(employeeId, 'UNMARKED');
  }

  // --- 13. Event Listeners Delegation ---
  document.addEventListener('click', async event => {
    const btn = event.target.closest('button');
    if (!btn) return;

    // แท็บนำทาง
    if (btn.dataset.tab) {
      switchTab(btn.dataset.tab);
      return;
    }

    // ปุ่มเช็คชื่อ (เต็มวัน / ครึ่งวัน / ไม่มา)
    if (btn.dataset.markStatus) {
      const empId = btn.dataset.empId;
      const status = btn.dataset.markStatus;
      await handleMarkAttendance(empId, status);
      return;
    }

    // ปุ่มลองตรวจสอบอีกครั้งหลัง timeout
    if (btn.dataset.retryEmpId) {
      const empId = btn.dataset.retryEmpId;
      const key = state.selectedDate + '|' + empId;
      const pending = state.pendingCommands.get(key);
      if (pending && pending.command) {
        pending.status = 'SAVING';
        renderAttendanceView();
        try {
          const res = await TeamRpc.call('saveAttendance', pending.command);
          if (res && res.ok && res.attendance) {
            state.pendingCommands.delete(key);
            const attList = state.dayAttendance.attendance || [];
            const idx = attList.findIndex(r => r.employeeId === empId);
            if (idx >= 0) attList[idx] = res.attendance;
            else attList.push(res.attendance);
            renderAttendanceView();
            announce('ตรวจสอบและยืนยันการบันทึกเรียบร้อยแล้ว');
          }
        } catch (e) {
          alert('ตรวจสอบไม่สำเร็จ: ' + (ERROR_MESSAGES[e.message] || e.message));
        }
      }
      return;
    }

    // เปิดโมดอลล้างรายการ
    if (btn.dataset.openClear) {
      renderClearModal(btn.dataset.openClear);
      return;
    }

    if (btn.id === 'btn-confirm-clear-action') {
      await handleClearAttendance(btn.dataset.empId);
      return;
    }

    if (btn.id === 'btn-close-modal') {
      closeModal();
      return;
    }

    if (btn.id === 'btn-goto-today') {
      loadDayAttendance(state.serverToday);
      return;
    }

    if (btn.id === 'btn-toggle-filter') {
      state.filterAttendance = !state.filterAttendance;
      renderAttendanceView();
      return;
    }

    if (btn.id === 'btn-add-special-workday') {
      if (!confirm('ยืนยันกำหนดให้วันนี้เป็นวันทำงานพิเศษหรือไม่?')) return;
      try {
        await TeamRpc.call('saveCalendar', {
          action: 'SET_OVERRIDE',
          dateKey: state.selectedDate,
          kind: 'WORKDAY',
          note: 'วันทำงานพิเศษ',
          expectedRevision: 0,
          requestId: uuid()
        });
        loadDayAttendance(state.selectedDate);
      } catch (e) {
        alert('บันทึกไม่สำเร็จ: ' + (ERROR_MESSAGES[e.message] || e.message));
      }
      return;
    }

    // รายงาน: เปิดดูรายบุคคล
    if (btn.dataset.openDetail) {
      state.selectedDetailId = btn.dataset.openDetail;
      renderEmployeeDetailView(state.selectedDetailId);
      return;
    }

    if (btn.id === 'btn-back-to-reports') {
      state.selectedDetailId = null;
      renderReportsView();
      return;
    }

    if (btn.id === 'btn-open-close-month-modal') {
      renderCloseMonthModal();
      return;
    }

    if (btn.id === 'btn-execute-close-month') {
      closeModal();
      try {
        announce('กำลังคำนวณและบันทึกปิดรอบเดือน...');
        const res = await TeamRpc.call('closeMonth', {
          monthKey: state.selectedMonth,
          expectedRevision: state.monthReport.monthState ? state.monthReport.monthState.revision : 1,
          requestId: uuid()
        });
        alert('ปิดรอบเดือนเรียบร้อยแล้ว');
        loadMonthReport(state.selectedMonth);
      } catch (e) {
        alert('ปิดเดือนไม่สำเร็จ: ' + (ERROR_MESSAGES[e.message] || e.message));
      }
      return;
    }

    if (btn.id === 'btn-open-reopen-modal') {
      renderReopenMonthModal();
      return;
    }

    if (btn.id === 'btn-execute-reopen-month') {
      const reasonInput = document.getElementById('input-reopen-reason');
      const reason = reasonInput ? reasonInput.value.trim() : '';
      if (!reason) {
        alert('กรุณาระบุเหตุผลในการเปิดเดือน');
        return;
      }
      closeModal();
      try {
        announce('กำลังเปิดรอบเดือน...');
        await TeamRpc.call('reopenMonth', {
          monthKey: state.selectedMonth,
          reason: reason,
          expectedRevision: state.monthReport.monthState ? state.monthReport.monthState.revision : 1,
          requestId: uuid()
        });
        alert('เปิดรอบเดือนเรียบร้อยแล้ว ตอนนี้สามารถแก้ไขข้อมูลได้');
        loadMonthReport(state.selectedMonth);
      } catch (e) {
        alert('เปิดเดือนไม่สำเร็จ: ' + (ERROR_MESSAGES[e.message] || e.message));
      }
      return;
    }

    if (btn.id === 'btn-print-report') {
      window.print();
      return;
    }

    if (btn.id === 'btn-manage-monthly-extras') {
      renderMonthlyExtrasManageModal(state.selectedDetailId);
      return;
    }

    if (btn.id === 'btn-confirm-extras-now') {
      try {
        await TeamRpc.call('confirmMonthExtras', {
          employeeId: state.selectedDetailId,
          monthKey: state.selectedMonth,
          requestId: uuid()
        });
        alert('ยืนยันการตรวจเงินพิเศษเรียบร้อยแล้ว');
        renderEmployeeDetailView(state.selectedDetailId);
      } catch (e) {
        alert('ยืนยันไม่สำเร็จ: ' + (ERROR_MESSAGES[e.message] || e.message));
      }
      return;
    }

    // ตั้งค่า: เพิ่ม/แก้ไขพนักงาน
    if (btn.id === 'btn-add-new-employee' || btn.id === 'btn-empty-add-emp') {
      state.editEmployee = 'new';
      state.editFormDraft = null;
      renderEditEmployeeView();
      return;
    }

    if (btn.dataset.editEmp) {
      state.editEmployee = btn.dataset.editEmp;
      state.editFormDraft = null;
      renderEditEmployeeView();
      return;
    }

    if (btn.id === 'btn-cancel-edit-emp' || btn.id === 'btn-cancel-employee') {
      state.editEmployee = null;
      state.editFormDraft = null;
      renderSettingsView();
      return;
    }

    if (btn.id === 'btn-add-extra-template-row') {
      if (!state.editFormDraft) {
        const emp = state.employees.find(e => e.employeeId === state.editEmployee);
        state.editFormDraft = { extraTemplates: [] };
      }
      if (!state.editFormDraft.extraTemplates) state.editFormDraft.extraTemplates = [];
      state.editFormDraft.extraTemplates.push({ label: '', amountSatang: 100000 });
      renderEditEmployeeView();
      return;
    }

    if (btn.dataset.removeXt !== undefined) {
      const idx = Number(btn.dataset.removeXt);
      if (state.editFormDraft && state.editFormDraft.extraTemplates) {
        state.editFormDraft.extraTemplates.splice(idx, 1);
        renderEditEmployeeView();
      }
      return;
    }

    if (btn.id === 'btn-prompt-end-employment') {
      const endVal = prompt('กรุณาระบุวันสิ้นสุดการทำงาน (YYYY-MM-DD):', state.serverToday);
      if (!endVal) return;
      if (!/^20\d{2}-\d{2}-\d{2}$/.test(endVal)) {
        alert('รูปแบบวันที่ไม่ถูกต้อง ต้องเป็น YYYY-MM-DD');
        return;
      }
      if (!confirm(`ยืนยันการสิ้นสุดการทำงานของพนักงาน ณ วันที่ ${endVal} ใช่หรือไม่?`)) return;

      const emp = state.employees.find(e => e.employeeId === state.editEmployee);
      try {
        await TeamRpc.call('setEmploymentEnd', {
          employeeId: emp.employeeId,
          endDate: endVal,
          expectedRevision: emp.revision,
          requestId: uuid()
        });
        alert('บันทึกการสิ้นสุดการทำงานเรียบร้อยแล้ว');
        state.editEmployee = null;
        initApp();
      } catch (e) {
        alert('เกิดข้อผิดพลาด: ' + (ERROR_MESSAGES[e.message] || e.message));
      }
      return;
    }
  });

  // Event: Change
  document.addEventListener('change', async event => {
    const target = event.target;

    // เปลี่ยนวันที่เช็คชื่อ
    if (target.id === 'input-att-date') {
      if (!target.value || target.value > state.serverToday) {
        target.value = state.selectedDate;
        return;
      }
      loadDayAttendance(target.value);
      return;
    }

    // เปลี่ยนเดือนรายงาน
    if (target.id === 'select-report-month') {
      loadMonthReport(target.value);
      return;
    }

    // อัปโหลดรูปภาพพนักงาน
    if (target.id === 'input-emp-photo') {
      const file = target.files[0];
      if (!file) return;
      try {
        announce('กำลังย่อขนาดรูปภาพ...');
        const compressed = await compressPhotoFile(file);
        if (!state.editFormDraft) state.editFormDraft = {};
        state.editFormDraft.photoDataUrl = compressed.dataUrl;
        state.editFormDraft.newPhotoBase64 = compressed.jpegBase64;
        state.editFormDraft.newPhotoW = compressed.width;
        state.editFormDraft.newPhotoH = compressed.height;

        const previewBox = document.getElementById('box-photo-preview');
        if (previewBox) {
          previewBox.innerHTML = `<img src="${compressed.dataUrl}" alt="รูปตัวอย่าง" class="team-file-preview">`;
        }
        announce('ย่อขนาดรูปภาพสำเร็จพร้อมบันทึก');
      } catch (e) {
        alert(e.message);
        target.value = '';
      }
      return;
    }
  });

  // Event: Input (ค้นหาชื่อ)
  document.addEventListener('input', event => {
    if (event.target.id === 'input-att-search') {
      state.searchQuery = event.target.value;
      renderAttendanceView();
    }
  });

  // Event: Submit Forms
  document.addEventListener('submit', async event => {
    event.preventDefault();

    // บันทึกฟอร์มพนักงาน
    if (event.target.id === 'form-employee') {
      const form = event.target;
      const name = form.name.value.trim();
      const position = form.position.value.trim();
      const nickname = form.nickname.value.trim();
      const startDate = form.startDate.value;
      const dailyWage = form.dailyWage.value.trim();
      const notes = form.notes.value.trim();
      const rateEffective = form.rateEffectiveFrom ? form.rateEffectiveFrom.value : startDate;

      if (!name || !position || !startDate || !dailyWage) {
        alert('กรุณากรอกข้อมูลที่จำเป็นให้ครบถ้วน');
        return;
      }

      let dailySatang = 0;
      try {
        dailySatang = parseMoneySatang(dailyWage);
      } catch (e) {
        alert(e.message);
        return;
      }

      // รวบรวม ExtraTemplates
      const xtRows = document.querySelectorAll('#extra-templates-list [data-xt-index]');
      const extraTemplates = [];
      for (const row of xtRows) {
        const lbl = row.querySelector('.xt-label').value.trim();
        const amtStr = row.querySelector('.xt-amount').value.trim();
        if (lbl) {
          try {
            const satang = parseMoneySatang(amtStr);
            extraTemplates.push({ label: lbl, amountSatang: satang });
          } catch (e) {
            alert(`เงินพิเศษ "${lbl}": ${e.message}`);
            return;
          }
        }
      }

      const isNew = state.editEmployee === 'new';
      const emp = isNew ? null : state.employees.find(e => e.employeeId === state.editEmployee);

      const payload = {
        employeeId: isNew ? '' : emp.employeeId,
        name: name,
        nickname: nickname,
        position: position,
        startDate: startDate,
        dailySatang: dailySatang,
        rateEffectiveFrom: rateEffective,
        extraTemplates: extraTemplates,
        notes: notes,
        expectedRevision: isNew ? 0 : emp.revision,
        requestId: uuid()
      };

      try {
        announce('กำลังบันทึกข้อมูลพนักงาน...');
        const res = await TeamRpc.call('saveEmployee', payload);
        if (res && res.ok && res.employee) {
          // หากมีรูปภาพใหม่ที่ย่อแล้ว ให้บันทึกรูปภาพด้วย
          if (state.editFormDraft && state.editFormDraft.newPhotoBase64) {
            await TeamRpc.call('savePhoto', {
              employeeId: res.employee.employeeId,
              jpegBase64: state.editFormDraft.newPhotoBase64,
              width: state.editFormDraft.newPhotoW,
              height: state.editFormDraft.newPhotoH,
              expectedRevision: 0,
              requestId: uuid()
            });
            state.photosCache.set(res.employee.employeeId, {
              jpegBase64: state.editFormDraft.newPhotoBase64,
              dataUrl: state.editFormDraft.photoDataUrl,
              version: res.employee.photoVersion + 1
            });
          }

          alert('บันทึกข้อมูลพนักงานเรียบร้อยแล้ว');
          state.editEmployee = null;
          state.editFormDraft = null;
          await initApp();
        }
      } catch (e) {
        alert('บันทึกไม่สำเร็จ: ' + (ERROR_MESSAGES[e.message] || e.message));
      }
      return;
    }

    // บันทึกเงินพิเศษประจำเดือนใน Detail View
    if (event.target.id === 'form-manage-month-extra') {
      const lbl = document.getElementById('input-me-label').value.trim();
      const amtStr = document.getElementById('input-me-amount').value.trim();
      if (!lbl) return;

      let satang = 0;
      try {
        satang = parseMoneySatang(amtStr);
      } catch (e) {
        alert(e.message);
        return;
      }

      closeModal();
      try {
        announce('กำลังบันทึกเงินพิเศษ...');
        await TeamRpc.call('saveMonthExtra', {
          monthKey: state.selectedMonth,
          employeeId: state.selectedDetailId,
          label: lbl,
          amountSatang: satang,
          expectedRevision: 0,
          requestId: uuid()
        });
        alert('เพิ่มรายการเงินพิเศษเดือนนี้เรียบร้อยแล้ว');
        renderEmployeeDetailView(state.selectedDetailId);
      } catch (e) {
        alert('เกิดข้อผิดพลาด: ' + (ERROR_MESSAGES[e.message] || e.message));
      }
      return;
    }
  });

  // --- 14. Initial Bootstrap ---
  async function initApp() {
    try {
      announce('กำลังเชื่อมต่อระบบ...');
      const bootstrap = await TeamRpc.call('getBootstrap');
      if (!bootstrap) throw new Error('NO_DATA');

      state.serverToday = bootstrap.serverToday || new Date().toISOString().slice(0, 10);
      state.selectedDate = state.serverToday;
      state.selectedMonth = bootstrap.monthKey || state.serverToday.slice(0, 7);
      state.shopName = bootstrap.shopName || 'DE TEAM';
      state.employees = bootstrap.employees || [];
      state.dayAttendance = bootstrap.dayAttendance || null;

      if (brandTitleEl) brandTitleEl.innerHTML = `${escapeHtml(state.shopName.slice(0, 2))} <span>${escapeHtml(state.shopName.slice(2))}</span>`;
      if (headerInfoEl) headerInfoEl.textContent = `เช็คชื่อและสรุปค่าจ้าง (${thaiDate(state.serverToday, { day: 'numeric', month: 'short' })})`;

      // เริ่มต้นที่แท็บเช็คชื่อ
      switchTab('attendance');
      announce('พร้อมใช้งาน');
    } catch (e) {
      contentEl.innerHTML = `
        <div class="team-card" style="padding: 1.5rem; border: 1.5px solid #FCA5A5;">
          <h2 style="color: #991B1B;">เชื่อมต่อระบบไม่สำเร็จ</h2>
          <p class="team-secondary">${escapeHtml(ERROR_MESSAGES[e.message] || e.message)}</p>
          <div style="margin-top: 1.2rem;">
            <button type="button" class="team-btn-primary" onclick="location.reload();">ลองเชื่อมต่อใหม่อีกครั้ง</button>
          </div>
        </div>
      `;
      announce('การเชื่อมต่อล้มเหลว');
    }
  }

  // เริ่มรันเมื่อโหลด DOM เสร็จ
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initApp);
  } else {
    initApp();
  }
})();


  </script>
</body>
